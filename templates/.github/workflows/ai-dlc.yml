# Deterministic AI-DLC gates. Planning (Gemini) runs in `huddle60 ui` on the PO's machine
# (or the optional planner service), never here.
# Pin `your-org/huddle60` to a full commit SHA in production.
name: ai-dlc
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  ai-dlc:
    # Never check out or run pull request code in this job: it holds a write token.
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request == null && github.event.sender.type != 'Bot' && (startsWith(github.event.comment.body, '/ai-dlc') || github.event.action != 'created'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AI_DLC_APP_ID }}
          private-key: ${{ secrets.AI_DLC_APP_PRIVATE_KEY }}
      - uses: your-org/huddle60@v0
        with:
          token: ${{ steps.app-token.outputs.token }}
          enabled: ${{ vars.AI_DLC_ENABLED || 'true' }}
