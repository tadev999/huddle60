name: Epic
description: Chức năng lớn gồm nhiều Story.
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu và người dùng
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi
      value: |
        - Trong phạm vi:
        - Ngoài phạm vi:
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Tiêu chí nghiệm thu Epic
      description: "Mỗi dòng một tiêu chí: - EC-01: ..."
    validations:
      required: true
  - type: textarea
    id: technical_refs
    attributes:
      label: Tham chiếu kỹ thuật
  - type: textarea
    id: risks
    attributes:
      label: Câu hỏi và rủi ro
